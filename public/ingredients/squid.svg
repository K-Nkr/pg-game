<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="squidBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="squidShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#squidShadow)" transform="rotate(20 80 80)">
    <!-- Curled cooked squid roll -->
    <path d="M 30 55 C 35 40 120 40 130 55 C 140 75 135 115 115 125 C 80 140 45 125 35 110 C 25 90 25 70 30 55 Z" 
          fill="url(#squidBody)" stroke="#fcd34d" stroke-width="1.5"/>

    <!-- Cross-hatch diamond lattice cuts (鹿の子の格子切り込み) -->
    <line x1="45" y1="55" x2="65" y2="115" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="65" y1="50" x2="85" y2="120" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="85" y1="48" x2="105" y2="115" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="105" y1="52" x2="120" y2="105" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>

    <line x1="115" y1="55" x2="45" y2="90" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="125" y1="72" x2="55" y2="110" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <line x1="120" y1="90" x2="70" y2="125" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>

    <!-- Chili oil glaze on cuts -->
    <circle cx="85" cy="80" r="3" fill="#dc2626" opacity="0.6"/>
    <circle cx="102" cy="72" r="2.5" fill="#ea580c" opacity="0.7"/>

    <!-- White plump highlights -->
    <path d="M 45 60 C 65 52 105 52 118 62" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
</svg>
