<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="dumplingBody" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fffbeb"/>
      <stop offset="85%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <filter id="dumpShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#dumpShadow)" transform="rotate(-15 80 80)">
    <!-- Crescent Dumpling Plump Belly -->
    <path d="M 25 90 C 25 50 65 30 100 35 C 135 40 145 75 135 105 C 120 135 50 135 25 90 Z" fill="url(#dumplingBody)" stroke="#fde047" stroke-width="1.5"/>

    <!-- Pleated Ruffled Edge (上部のひだ) -->
    <path d="M 32 65 Q 45 45 55 52 Q 68 38 78 46 Q 92 36 102 45 Q 115 40 125 55 Q 135 58 135 75" 
          stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 55 52 Q 58 68 55 78" stroke="#ca8a04" stroke-width="1.8" fill="none" opacity="0.6"/>
    <path d="M 78 46 Q 80 65 76 80" stroke="#ca8a04" stroke-width="1.8" fill="none" opacity="0.6"/>
    <path d="M 102 45 Q 102 65 98 78" stroke="#ca8a04" stroke-width="1.8" fill="none" opacity="0.6"/>

    <!-- Chili oil tint on skin -->
    <ellipse cx="65" cy="85" rx="14" ry="8" fill="#ef4444" opacity="0.25" transform="rotate(-15 65 85)"/>
    
    <!-- Juicy sheen highlight -->
    <path d="M 45 75 C 60 62 100 62 115 80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <circle cx="58" cy="72" r="3.5" fill="#ffffff"/>
  </g>
</svg>
