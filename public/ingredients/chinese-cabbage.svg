<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cabbageLeaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="35%" stop-color="#bbf7d0"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="cabbageShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#cabbageShadow)">
    <!-- Wavy broad cabbage leaf -->
    <path d="M 52 140 C 42 110 30 75 35 45 C 40 25 65 18 80 32 C 95 18 120 25 125 45 C 130 75 118 110 108 140 C 95 146 65 146 52 140 Z" 
          fill="url(#cabbageLeaf)" stroke="#4ade80" stroke-width="1.5"/>

    <!-- Frilly ruffled edges at top (葉先のチリチリ) -->
    <path d="M 38 48 C 30 38 45 28 55 35 C 65 25 75 35 80 30 C 85 35 95 25 105 35 C 115 28 130 38 122 48" 
          stroke="#22c55e" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Broad white juicy midrib veins (太い白い葉脈) -->
    <path d="M 80 142 L 80 55" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M 80 115 Q 60 95 48 85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M 80 115 Q 100 95 112 85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M 80 90 Q 62 75 52 65" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 80 90 Q 98 75 108 65" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Shiny dew highlight -->
    <circle cx="70" cy="115" r="2.5" fill="#ffffff"/>
  </g>
</svg>
