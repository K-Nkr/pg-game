<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="sausageSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="75%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="sausageShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#sausageShadow)">
    <!-- Curved plump sausage -->
    <path d="M 30 115 C 18 90 25 50 60 35 C 95 20 130 45 138 75 C 142 95 125 105 110 98 C 95 90 92 65 72 65 C 55 65 52 95 45 110 C 40 118 34 122 30 115 Z" 
          fill="url(#sausageSkin)" stroke="#991b1b" stroke-width="2"/>

    <!-- Diagonal juicy slice slits (斜めの飾り包丁) -->
    <path d="M 52 42 Q 62 48 68 58" stroke="#450a0a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 54 44 Q 63 50 69 59" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <path d="M 72 35 Q 82 42 88 54" stroke="#450a0a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 74 37 Q 83 44 89 55" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <path d="M 95 38 Q 104 46 108 60" stroke="#450a0a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 97 40 Q 105 48 109 61" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <path d="M 115 50 Q 122 60 122 75" stroke="#450a0a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 117 52 Q 123 62 123 76" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Shiny gloss along upper curve -->
    <path d="M 45 52 C 60 35 90 32 120 48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
