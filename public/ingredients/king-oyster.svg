<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="oysterStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="oysterCap" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="70%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <filter id="koShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#koShadow)" transform="rotate(-20 80 80)">
    <!-- Broad thick white stalk slice -->
    <path d="M 52 50 C 48 85 45 115 50 135 C 55 142 105 142 110 135 C 115 115 112 85 108 50 Z" 
          fill="url(#oysterStem)" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Small rounded brown cap at top -->
    <path d="M 45 52 C 45 35 115 35 115 52 C 115 58 45 58 45 52 Z" fill="url(#oysterCap)" stroke="#451a03" stroke-width="1.2"/>

    <!-- Fine vertical fiber veins (キノコの縦繊維) -->
    <line x1="62" y1="58" x2="62" y2="130" stroke="#ca8a04" stroke-width="1" opacity="0.35"/>
    <line x1="75" y1="58" x2="75" y2="132" stroke="#ca8a04" stroke-width="1" opacity="0.35"/>
    <line x1="88" y1="58" x2="88" y2="132" stroke="#ca8a04" stroke-width="1" opacity="0.35"/>
    <line x1="98" y1="58" x2="98" y2="130" stroke="#ca8a04" stroke-width="1" opacity="0.35"/>

    <!-- Glossy stem reflection -->
    <path d="M 70 65 L 70 125" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
