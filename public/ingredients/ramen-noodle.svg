<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Curly Ramen Noodle Color -->
    <linearGradient id="ramenGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="ramenGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="ramenShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#451a03" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#ramenShadow)">
    <!-- Entangled Curly Noodle Strands (ちぢれ麺のリアルなうねり) -->
    <!-- Strand 1 -->
    <path d="M 30 110 Q 50 80 70 120 T 110 90 T 150 130 T 170 100" 
          stroke="url(#ramenGrad1)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Strand 2 -->
    <path d="M 40 80 Q 65 125 90 75 T 130 125 T 165 70" 
          stroke="url(#ramenGrad2)" stroke-width="9.5" stroke-linecap="round" fill="none"/>
    <!-- Strand 3 -->
    <path d="M 50 140 Q 75 90 105 135 T 145 85 T 160 145" 
          stroke="url(#ramenGrad1)" stroke-width="8.5" stroke-linecap="round" fill="none"/>
    <!-- Strand 4 -->
    <path d="M 35 125 Q 70 155 100 110 T 140 140 T 165 120" 
          stroke="url(#ramenGrad2)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Strand 5 (Top curvy strand) -->
    <path d="M 60 65 Q 90 95 120 60 T 155 85" 
          stroke="url(#ramenGrad1)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Shiny gloss along curly ridges -->
    <path d="M 45 82 Q 62 120 85 78" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 105 92 Q 125 72 145 122" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 72 118 Q 90 85 108 128" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Soup Droplets & Chili oil sheen on curly noodles -->
    <ellipse cx="92" cy="78" rx="4" ry="2.8" fill="#dc2626" opacity="0.7" transform="rotate(15 92 78)"/>
    <circle cx="91" cy="77" r="1" fill="#ffffff" opacity="0.9"/>

    <ellipse cx="132" cy="115" rx="4.5" ry="3" fill="#ea580c" opacity="0.7" transform="rotate(-20 132 115)"/>
    <circle cx="131" cy="114" r="1.2" fill="#ffffff" opacity="0.9"/>

    <ellipse cx="62" cy="110" rx="3.5" ry="2" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8" transform="rotate(40 62 110)"/>
    <ellipse cx="145" cy="85" rx="3.5" ry="2" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8" transform="rotate(-30 145 85)"/>
  </g>
</svg>
