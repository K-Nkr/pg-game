<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="crabRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="crabWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="crabShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#crabShadow)" transform="rotate(-25 80 80)">
    <!-- Base White Meat stick -->
    <rect x="25" y="55" width="110" height="50" rx="14" fill="url(#crabWhite)" stroke="#fca5a5" stroke-width="1.5"/>

    <!-- Red Outer Coat Top Half -->
    <path d="M 25 70 C 25 60 32 55 42 55 L 118 55 C 128 55 135 60 135 70 L 135 80 C 110 82 50 82 25 80 Z" fill="url(#crabRed)"/>

    <!-- Shredded crab meat fibers (細い繊維の線) -->
    <line x1="35" y1="58" x2="35" y2="102" stroke="#f87171" stroke-width="1.2" opacity="0.6"/>
    <line x1="50" y1="56" x2="50" y2="104" stroke="#f87171" stroke-width="1.2" opacity="0.6"/>
    <line x1="65" y1="56" x2="65" y2="104" stroke="#f87171" stroke-width="1.2" opacity="0.6"/>
    <line x1="80" y1="56" x2="80" y2="104" stroke="#f87171" stroke-width="1.2" opacity="0.6"/>
    <line x1="95" y1="56" x2="95" y2="104" stroke="#f87171" stroke-width="1.2" opacity="0.6"/>
    <line x1="110" y1="56" x2="110" y2="104" stroke="#f87171" stroke-width="1.2" opacity="0.6"/>
    <line x1="125" y1="58" x2="125" y2="102" stroke="#f87171" stroke-width="1.2" opacity="0.6"/>

    <!-- Light glisten on top -->
    <path d="M 38 60 L 122 60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
