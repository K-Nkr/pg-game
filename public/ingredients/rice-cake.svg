<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="riceCakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="cakeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#cakeShadow)">
    <!-- Rice cake stick 1 -->
    <g transform="translate(10, 10) rotate(-25 60 70)">
      <rect x="25" y="55" width="90" height="28" rx="14" fill="url(#riceCakeGrad)" stroke="#fde047" stroke-width="1.5"/>
      <ellipse cx="38" cy="69" rx="7" ry="12" fill="#fff" opacity="0.6"/>
      <path d="M 40 60 L 105 60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Chili glaze -->
      <path d="M 60 62 C 75 58 90 65 105 63" stroke="#dc2626" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
    </g>
    <!-- Rice cake stick 2 -->
    <g transform="translate(25, 45) rotate(15 70 70)">
      <rect x="25" y="55" width="90" height="28" rx="14" fill="url(#riceCakeGrad)" stroke="#fde047" stroke-width="1.5"/>
      <path d="M 40 60 L 105 60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 50 68 C 65 65 80 72 95 68" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>
</svg>
