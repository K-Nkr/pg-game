<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="cheeseBallGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fffbeb"/>
      <stop offset="90%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba861"/>
    </radialGradient>
    <radialGradient id="meltedCheese" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <filter id="cBallShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#cBallShadow)">
    <!-- Ball body -->
    <circle cx="80" cy="80" r="54" fill="url(#cheeseBallGrad)" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Cut showing oozing gooey yellow cheese (とろけるチーズ) -->
    <path d="M 60 70 C 55 58 105 58 100 70 C 105 85 95 105 80 108 C 65 105 55 85 60 70 Z" fill="url(#meltedCheese)"/>
    <ellipse cx="80" cy="78" rx="14" ry="10" fill="#fef08a"/>

    <!-- Gooey cheese stretch droplet -->
    <path d="M 76 95 Q 80 115 82 108" stroke="#facc15" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Juicy glaze highlight -->
    <ellipse cx="58" cy="52" rx="15" ry="9" transform="rotate(-25 58 52)" fill="#ffffff" opacity="0.8"/>
    <circle cx="50" cy="46" r="3.5" fill="#ffffff"/>
  </g>
</svg>
