<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="spamFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="45%" stop-color="#fb7185"/>
      <stop offset="85%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="spamSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="spamShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="3.5" flood-opacity="0.32"/>
    </filter>
  </defs>
  <g filter="url(#spamShadow)">
    <!-- 3D Thickness side -->
    <path d="M 22 108 L 22 122 Q 22 128 28 130 L 132 130 Q 138 128 138 122 L 138 108 Z" fill="url(#spamSide)"/>
    <path d="M 132 130 L 146 112 Q 150 106 150 100 L 150 86 L 138 108 Z" fill="#4c0519"/>

    <!-- Top Rounded Rectangular Slab -->
    <path d="M 32 32 Q 22 34 22 45 L 22 108 Q 24 118 35 118 L 125 118 Q 138 118 138 108 L 138 45 Q 136 32 125 32 Z" 
          fill="url(#spamFace)" stroke="#e11d48" stroke-width="2"/>

    <!-- Pork Fat Flecks (White tiny specks) -->
    <ellipse cx="40" cy="50" rx="3.5" ry="2" fill="#fff1f2"/>
    <ellipse cx="65" cy="42" rx="4" ry="2.5" fill="#fff1f2"/>
    <ellipse cx="98" cy="48" rx="3" ry="2" fill="#fff1f2"/>
    <ellipse cx="120" cy="62" rx="4" ry="3" fill="#fff1f2"/>
    <ellipse cx="45" cy="85" rx="4" ry="2" fill="#fff1f2"/>
    <ellipse cx="80" cy="78" rx="5" ry="3" fill="#fff1f2"/>
    <ellipse cx="112" cy="95" rx="3.5" ry="2.5" fill="#fff1f2"/>
    <ellipse cx="60" cy="102" rx="4" ry="2" fill="#fff1f2"/>

    <!-- Grilled Sear Marks (こんがり焼き目) -->
    <line x1="38" y1="36" x2="80" y2="114" stroke="#881337" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="68" y1="36" x2="110" y2="114" stroke="#881337" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="98" y1="36" x2="135" y2="100" stroke="#881337" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Juicy glaze reflection -->
    <path d="M 30 45 Q 80 40 128 45" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
