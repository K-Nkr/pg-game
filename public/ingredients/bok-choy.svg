<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d8a4e"/>
      <stop offset="50%" stop-color="#1e6b37"/>
      <stop offset="100%" stop-color="#0f4520"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#48bb78"/>
      <stop offset="70%" stop-color="#2f855a"/>
      <stop offset="100%" stop-color="#22543d"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#edfbf2"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#dropShadow)">
    <!-- Back Leaf -->
    <path d="M 50 70 C 30 40 45 15 75 10 C 95 6 120 20 115 55 C 110 75 90 90 75 95 Z" fill="url(#leafGrad1)"/>
    <path d="M 68 35 Q 78 50 82 75" stroke="#48bb78" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 90 32 Q 92 50 85 70" stroke="#48bb78" stroke-width="1.5" fill="none" opacity="0.5"/>
    
    <!-- Left Leaf -->
    <path d="M 35 95 C 15 75 10 45 35 25 C 55 10 75 25 70 65 C 65 95 45 105 35 95 Z" fill="url(#leafGrad2)"/>
    <path d="M 33 45 Q 48 60 55 85" stroke="#86efac" stroke-width="1.8" fill="none" opacity="0.7"/>

    <!-- Right Leaf -->
    <path d="M 125 90 C 145 65 140 35 115 20 C 95 10 80 30 90 70 C 98 100 115 105 125 90 Z" fill="url(#leafGrad2)"/>
    <path d="M 120 40 Q 110 60 100 85" stroke="#86efac" stroke-width="1.8" fill="none" opacity="0.7"/>

    <!-- Center Leaf -->
    <path d="M 55 110 C 35 85 45 35 80 30 C 115 35 125 85 105 110 C 95 120 65 120 55 110 Z" fill="url(#leafGrad1)"/>
    <path d="M 80 40 Q 80 75 80 110" stroke="#86efac" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 80 60 Q 60 50 50 65" stroke="#86efac" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 80 75 Q 100 65 110 80" stroke="#86efac" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Stems (Juicy white/pale green base) -->
    <path d="M 45 110 C 45 95 55 85 70 85 C 80 85 85 95 85 110 C 85 135 70 148 55 145 C 48 142 45 125 45 110 Z" fill="url(#stemGrad)" stroke="#86efac" stroke-width="1"/>
    <path d="M 75 110 C 75 92 88 85 98 85 C 112 85 118 95 115 115 C 112 135 100 148 85 148 C 76 142 75 125 75 110 Z" fill="url(#stemGrad)" stroke="#86efac" stroke-width="1"/>
    <path d="M 58 115 C 55 100 65 92 80 92 C 95 92 102 100 102 115 C 102 142 90 152 80 152 C 70 152 58 142 58 115 Z" fill="url(#stemGrad)" stroke="#4ade80" stroke-width="1.2"/>
    
    <!-- Glossy Stem Highlights -->
    <path d="M 76 98 Q 78 125 78 145" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 64 105 Q 65 125 62 138" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>
