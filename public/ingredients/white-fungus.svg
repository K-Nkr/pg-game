<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="whiteFungusGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fffbeb"/>
      <stop offset="85%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <filter id="wfShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3.5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#wfShadow)">
    <!-- Fluffy ruffled petals cluster -->
    <path d="M 50 45 C 30 25 75 15 95 30 C 120 18 140 45 125 70 C 145 95 125 135 95 130 C 70 145 35 130 30 100 C 15 75 35 55 50 45 Z" 
          fill="url(#whiteFungusGrad)" stroke="#fde047" stroke-width="1.2"/>

    <!-- Inner frilly folds -->
    <path d="M 45 65 C 60 50 85 62 80 85 C 75 105 55 110 45 95 Z" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <path d="M 80 45 C 105 35 120 55 110 80 C 100 100 85 95 80 75 Z" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <path d="M 70 80 C 90 70 110 85 105 110 C 95 125 75 120 70 100 Z" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>

    <!-- Soft translucent highlights -->
    <path d="M 55 40 Q 75 30 95 42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 95 70 Q 115 62 120 85" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
