<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 串（竹串） -->
  <rect x="47" y="8" width="6" height="84" rx="3" fill="#c8a96a" stroke="#a07040" stroke-width="1"/>
  <rect x="48.5" y="9" width="2" height="82" rx="1" fill="#dfc08a" opacity="0.6"/>

  <!-- 上の球：赤 -->
  <defs>
    <radialGradient id="dRed" cx="38%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#ff9999"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
    <radialGradient id="dOrange" cx="38%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#ffd080"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="dYellow" cx="38%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <radialGradient id="dGreen" cx="38%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="dBlue" cx="38%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
    <radialGradient id="dPurple" cx="38%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </radialGradient>
  </defs>

  <!-- 球 1: 赤 (上) -->
  <circle cx="50" cy="20" r="13" fill="url(#dRed)" stroke="#fff" stroke-width="1.5"/>
  <ellipse cx="44" cy="15" rx="4" ry="2.5" fill="white" opacity="0.45" transform="rotate(-20,44,15)"/>

  <!-- 球 2: 橙 -->
  <circle cx="50" cy="43" r="13" fill="url(#dOrange)" stroke="#fff" stroke-width="1.5"/>
  <ellipse cx="44" cy="38" rx="4" ry="2.5" fill="white" opacity="0.45" transform="rotate(-20,44,38)"/>

  <!-- 球 3: 黄 -->
  <circle cx="50" cy="66" r="13" fill="url(#dYellow)" stroke="#fff" stroke-width="1.5"/>
  <ellipse cx="44" cy="61" rx="4" ry="2.5" fill="white" opacity="0.45" transform="rotate(-20,44,61)"/>

  <!-- 底のとがり（串の先っぽ） -->
  <ellipse cx="50" cy="90" rx="3" ry="5" fill="#b8903a" stroke="#8a6a20" stroke-width="0.5"/>
</svg>
