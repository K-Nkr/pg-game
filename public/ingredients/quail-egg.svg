<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="eggGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fffbeb"/>
      <stop offset="85%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <radialGradient id="eggYolk" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="eggShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#eggShadow)">
    <!-- Egg 1: Half cut showing golden creamy yolk -->
    <g transform="translate(15, 20) rotate(-15 60 60)">
      <ellipse cx="60" cy="65" rx="42" ry="48" fill="url(#eggGrad)" stroke="#fde047" stroke-width="1.5"/>
      <!-- Yolk -->
      <ellipse cx="60" cy="70" rx="26" ry="28" fill="url(#eggYolk)"/>
      <ellipse cx="53" cy="62" rx="7" ry="5" fill="#ffffff" opacity="0.8"/>
      <circle cx="68" cy="74" r="3" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- Egg 2: Whole glossy quail egg resting beside -->
    <g transform="translate(65, 55)">
      <ellipse cx="50" cy="50" rx="26" ry="32" transform="rotate(35 50 50)" fill="url(#eggGrad)" stroke="#fde047" stroke-width="1.5"/>
      <!-- Glossy highlight -->
      <ellipse cx="45" cy="40" rx="9" ry="5" transform="rotate(25 45 40)" fill="#ffffff" opacity="0.85"/>
      <circle cx="56" cy="46" r="3" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>
</svg>
