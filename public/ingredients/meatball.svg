<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="meatGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#d97746"/>
      <stop offset="25%" stop-color="#b85328"/>
      <stop offset="60%" stop-color="#803115"/>
      <stop offset="90%" stop-color="#541b09"/>
      <stop offset="100%" stop-color="#360f04"/>
    </radialGradient>
    <radialGradient id="meatShine" cx="30%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#fbd38d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97746" stop-opacity="0"/>
    </radialGradient>
    <filter id="ballShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#ballShadow)">
    <!-- Slightly uneven meatball contour -->
    <path d="M 80 20 C 115 18 142 45 142 80 C 142 114 116 142 80 142 C 44 142 18 116 18 80 C 18 46 45 22 80 20 Z" fill="url(#meatGrad)"/>
    
    <!-- Surface texture / minced meat markings -->
    <path d="M 50 65 Q 60 70 55 80" stroke="#451406" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 85 45 Q 98 48 92 60" stroke="#451406" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 95 85 Q 110 95 100 110" stroke="#451406" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 60 105 Q 75 115 70 125" stroke="#451406" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 38 90 Q 42 100 35 110" stroke="#451406" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Chili / spice flakes on surface -->
    <polygon points="75,52 79,50 82,55 77,57" fill="#c53030"/>
    <polygon points="105,72 110,70 108,76 103,75" fill="#e53e3e"/>
    <polygon points="62,88 66,85 68,91 63,92" fill="#dd6b20"/>
    <polygon points="88,112 92,110 95,115 90,117" fill="#9b2c2c"/>

    <!-- Shiny gloss highlight -->
    <ellipse cx="60" cy="50" rx="22" ry="14" transform="rotate(-30 60 50)" fill="url(#meatShine)"/>
    <circle cx="50" cy="42" r="5" fill="#ffffff" opacity="0.75"/>
    <circle cx="68" cy="48" r="2.5" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
