<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="noodleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#fed7aa" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#fdba74" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="noodleGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fed7aa" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#fb923c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="noodleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#noodleShadow)">
    <!-- Flat broad glass noodles looped -->
    <!-- Ribbon 1 (Back) -->
    <path d="M 25 105 C 15 55 45 25 80 35 C 115 45 145 25 135 75 C 128 115 100 135 65 130 C 35 125 35 100 50 95" 
          stroke="url(#noodleGrad1)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 25 105 C 15 55 45 25 80 35 C 115 45 145 25 135 75 C 128 115 100 135 65 130 C 35 125 35 100 50 95" 
          stroke="#ffedd5" stroke-width="17" stroke-linecap="round" fill="none" opacity="0.3"/>

    <!-- Ribbon 2 (Front wavy layer) -->
    <path d="M 35 60 C 60 40 85 80 115 65 C 135 55 145 95 120 120 C 95 145 60 110 35 115" 
          stroke="url(#noodleGrad2)" stroke-width="20" stroke-linecap="round" fill="none"/>
    
    <!-- Edge borders / translucency contour lines -->
    <path d="M 33 50 C 58 30 83 70 113 55 C 133 45 143 85 118 110" 
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 37 70 C 62 50 87 90 117 75 C 137 65 147 105 122 130" 
          stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>

    <!-- Highlight glisten / shiny wet glass reflection -->
    <path d="M 45 52 Q 65 48 85 70" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 115 72 Q 130 90 115 110" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>
</svg>
