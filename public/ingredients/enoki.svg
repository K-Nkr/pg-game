<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="enokiStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fffbeb"/>
      <stop offset="85%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="enokiCap" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="enokiShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#enokiShadow)">
    <!-- Bound cluster base at bottom -->
    <path d="M 60 135 C 65 145 95 145 100 135 C 95 115 65 115 60 135 Z" fill="#ca8a04" opacity="0.7"/>

    <!-- Enoki Stems (Multiple slender curved strands) -->
    <!-- Back row -->
    <path d="M 68 135 Q 55 80 45 42" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 78 135 Q 85 85 95 38" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 88 135 Q 105 85 115 48" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Middle row -->
    <path d="M 65 135 Q 45 90 35 60" stroke="url(#enokiStem)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 72 135 Q 68 80 62 35" stroke="url(#enokiStem)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 82 135 Q 80 75 78 30" stroke="url(#enokiStem)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 90 135 Q 98 80 105 45" stroke="url(#enokiStem)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 94 135 Q 115 90 125 65" stroke="url(#enokiStem)" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Front row -->
    <path d="M 70 135 Q 58 95 50 50" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 76 135 Q 75 88 70 42" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 84 135 Q 88 92 88 40" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 88 135 Q 102 95 108 55" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Little Caps (Little buttons) -->
    <ellipse cx="45" cy="42" rx="7.5" ry="6" fill="url(#enokiCap)"/>
    <ellipse cx="35" cy="60" rx="7" ry="5.5" fill="url(#enokiCap)"/>
    <ellipse cx="62" cy="35" rx="8" ry="6" fill="url(#enokiCap)"/>
    <ellipse cx="50" cy="50" rx="7.5" ry="6" fill="url(#enokiCap)"/>
    <ellipse cx="78" cy="30" rx="8.5" ry="6.5" fill="url(#enokiCap)"/>
    <ellipse cx="70" cy="42" rx="7.5" ry="6" fill="url(#enokiCap)"/>
    <ellipse cx="88" cy="40" rx="8" ry="6" fill="url(#enokiCap)"/>
    <ellipse cx="95" cy="38" rx="8" ry="6" fill="url(#enokiCap)"/>
    <ellipse cx="105" cy="45" rx="7.5" ry="6" fill="url(#enokiCap)"/>
    <ellipse cx="108" cy="55" rx="7" ry="5.5" fill="url(#enokiCap)"/>
    <ellipse cx="115" cy="48" rx="7.5" ry="6" fill="url(#enokiCap)"/>
    <ellipse cx="125" cy="65" rx="7" ry="5.5" fill="url(#enokiCap)"/>
  </g>
</svg>
