<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="thinNoodleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fed7aa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="thinNoodleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#thinNoodleShadow)">
    <!-- Swirls of thin glass noodles -->
    <path d="M 30 110 C 20 60 50 30 85 40 C 120 50 145 35 135 80 C 125 125 90 145 60 135 C 35 125 35 90 60 85 C 90 80 115 100 110 120" 
          stroke="url(#thinNoodleGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 45 70 C 65 35 115 45 125 85 C 135 125 95 140 70 120 C 45 100 50 65 80 60 C 110 55 130 90 115 115" 
          stroke="url(#thinNoodleGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 35 90 Q 65 120 95 85 T 140 100" 
          stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 40 105 Q 75 75 110 110" 
          stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <!-- Sesame seeds -->
    <ellipse cx="75" cy="65" rx="3" ry="1.8" fill="#fef08a" stroke="#ca8a04" stroke-width="0.7" transform="rotate(25 75 65)"/>
    <ellipse cx="105" cy="95" rx="3" ry="1.8" fill="#fef08a" stroke="#ca8a04" stroke-width="0.7" transform="rotate(-35 105 95)"/>
  </g>
</svg>
