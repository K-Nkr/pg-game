<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="cornShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#cornShadow)" transform="rotate(-35 80 80)">
    <!-- Tapered young corn body -->
    <path d="M 68 135 C 65 142 95 142 92 135 L 85 28 C 83 22 77 22 75 28 Z" fill="url(#cornGrad)" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Tiny kernel rows -->
    <!-- Row 1 -->
    <circle cx="76" cy="38" r="2.5" fill="#ca8a04" opacity="0.6"/><circle cx="84" cy="38" r="2.5" fill="#ca8a04" opacity="0.6"/>
    <!-- Row 2 -->
    <circle cx="74" cy="50" r="3" fill="#ca8a04" opacity="0.6"/><circle cx="82" cy="50" r="3" fill="#ca8a04" opacity="0.6"/><circle cx="89" cy="50" r="2.5" fill="#ca8a04" opacity="0.6"/>
    <!-- Row 3 -->
    <circle cx="72" cy="64" r="3.2" fill="#ca8a04" opacity="0.6"/><circle cx="80" cy="64" r="3.2" fill="#ca8a04" opacity="0.6"/><circle cx="88" cy="64" r="3.2" fill="#ca8a04" opacity="0.6"/>
    <!-- Row 4 -->
    <circle cx="71" cy="78" r="3.5" fill="#ca8a04" opacity="0.6"/><circle cx="80" cy="78" r="3.5" fill="#ca8a04" opacity="0.6"/><circle cx="89" cy="78" r="3.5" fill="#ca8a04" opacity="0.6"/>
    <!-- Row 5 -->
    <circle cx="70" cy="94" r="3.8" fill="#ca8a04" opacity="0.6"/><circle cx="80" cy="94" r="3.8" fill="#ca8a04" opacity="0.6"/><circle cx="90" cy="94" r="3.8" fill="#ca8a04" opacity="0.6"/>
    <!-- Row 6 -->
    <circle cx="69" cy="110" r="4" fill="#ca8a04" opacity="0.6"/><circle cx="80" cy="110" r="4" fill="#ca8a04" opacity="0.6"/><circle cx="91" cy="110" r="4" fill="#ca8a04" opacity="0.6"/>
    <!-- Row 7 -->
    <circle cx="68" cy="126" r="4.2" fill="#ca8a04" opacity="0.6"/><circle cx="80" cy="126" r="4.2" fill="#ca8a04" opacity="0.6"/><circle cx="92" cy="126" r="4.2" fill="#ca8a04" opacity="0.6"/>

    <!-- Light reflection along cone -->
    <path d="M 77 32 L 73 130" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  </g>
</svg>
