<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="woodEarGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a3b32"/>
      <stop offset="35%" stop-color="#2a201c"/>
      <stop offset="75%" stop-color="#140f0c"/>
      <stop offset="100%" stop-color="#0a0706"/>
    </radialGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a8a7a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#140f0c" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Main undulating gelatinous body -->
    <path d="M 45 45 C 65 20 110 25 125 50 C 145 75 140 115 110 135 C 80 150 40 140 25 115 C 10 90 25 65 45 45 Z" fill="url(#woodEarGrad)"/>
    
    <!-- Deep Ruffles and folds -->
    <path d="M 35 70 C 50 60 75 75 70 100 C 65 118 45 125 35 110 C 25 98 25 80 35 70 Z" fill="#1b1410" stroke="#3d2f26" stroke-width="1.5"/>
    <path d="M 65 50 C 90 35 115 50 110 80 C 105 105 85 110 75 95 C 65 80 60 65 65 50 Z" fill="#241b16" stroke="#4a3a30" stroke-width="1.5"/>
    <path d="M 85 85 C 105 70 130 85 125 115 C 120 130 95 130 85 115 C 78 105 78 95 85 85 Z" fill="#18110e" stroke="#35261f" stroke-width="1.2"/>

    <!-- Jelly shine / moist reflections -->
    <path d="M 50 40 C 70 30 95 35 105 45" stroke="url(#shineGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 30 85 C 32 75 42 68 52 72" stroke="#8c7b6c" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 75 62 C 85 55 98 58 102 68" stroke="#a39281" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 88 102 C 95 98 108 100 112 108" stroke="#8c7b6c" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
</svg>
