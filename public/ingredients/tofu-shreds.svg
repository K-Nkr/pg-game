<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="tofuShredsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shredShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shredShadow)">
    <!-- Bound cluster of flat dried tofu strips -->
    <path d="M 30 115 Q 60 70 80 120 T 135 100" stroke="url(#tofuShredsGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 40 85 Q 70 125 105 75 T 140 110" stroke="url(#tofuShredsGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 45 125 Q 85 90 120 130" stroke="url(#tofuShredsGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 35 100 Q 80 60 125 90" stroke="#fef9c3" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 55 65 Q 90 95 130 65" stroke="url(#tofuShredsGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 60 110 Q 95 135 125 105" stroke="#ca8a04" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Chili oil specks -->
    <circle cx="85" cy="85" r="2.5" fill="#dc2626"/>
    <circle cx="110" cy="100" r="2" fill="#ea580c"/>
  </g>
</svg>
